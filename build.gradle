plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '1.9.25'
}

group = 'camp.nextstep.edu'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'com.github.woowacourse-projects:mission-utils:1.2.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    testImplementation "org.jetbrains.kotlin:kotlin-test"        // ✅ 코틀린 테스트
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.3"  // ✅ JUnit5
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "21"    // ✅ Java toolchain과 맞추기
    }
}

test {
    useJUnitPlatform()
}
